<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Player</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d14;
            --surface: #13131f;
            --card: #1a1a2b;
            --border: #2a2a40;
            --text: #e8e8f0;
            --muted: #7070a0;
            --accent: #6c63ff;
            --accent2: #ff6b9d;
            --correct: #22d3a0;
            --wrong: #ff5c7a;
            --glow: rgba(108, 99, 255, 0.25);
        }

        body.light {
            --bg: #f0f0f8;
            --surface: #ffffff;
            --card: #ffffff;
            --border: #e0e0ee;
            --text: #1a1a2b;
            --muted: #8080aa;
            --accent: #5a52e0;
            --accent2: #e0547e;
            --correct: #18b88a;
            --wrong: #e04060;
            --glow: rgba(90, 82, 224, 0.15);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 30px 16px 60px;
            transition: background 0.4s, color 0.4s;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 500px;
            background: radial-gradient(ellipse, var(--glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
        }

        .wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 720px;
        }

        /* ===== SELECTION SCREEN ===== */
        #select-screen {
            animation: fadeUp 0.5s ease;
        }

        .brand {
            text-align: center;
            margin-bottom: 48px;
        }

        .brand h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .brand p {
            color: var(--muted);
            margin-top: 10px;
            font-size: 1rem;
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .quiz-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }

        .quiz-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            opacity: 0;
            transition: opacity 0.25s;
        }

        .quiz-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px var(--glow);
        }

        .quiz-card:hover::before {
            opacity: 0.04;
        }

        .quiz-card-icon {
            font-size: 2rem;
            margin-bottom: 14px;
            display: block;
        }

        .quiz-card h3 {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .quiz-card p {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .quiz-card-meta {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--border);
            color: var(--muted);
            font-weight: 500;
        }

        .badge.accent {
            background: rgba(108, 99, 255, 0.15);
            color: var(--accent);
        }

        /* ===== QUIZ SCREEN ===== */
        #quiz-screen {
            animation: fadeUp 0.4s ease;
        }

        .quiz-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .back-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .quiz-title-bar {
            flex: 1;
        }

        .quiz-title-bar h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
        }

        .quiz-title-bar span {
            color: var(--muted);
            font-size: 0.8rem;
        }

        .progress-wrap {
            background: var(--border);
            border-radius: 99px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 28px;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.4s cubic-bezier(.4, 0, .2, 1);
            border-radius: 99px;
        }

        .q-meta {
            color: var(--muted);
            font-size: 0.82rem;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .question {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 24px;
            line-height: 1.45;
        }

        .options-grid {
            display: grid;
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            text-align: left;
            transition: all 0.2s;
        }

        .option:hover:not(:disabled) {
            border-color: var(--accent);
            background: var(--surface);
        }

        .option-letter {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            color: var(--accent);
            min-width: 22px;
            font-size: 0.9rem;
        }

        .option.correct {
            background: rgba(34, 211, 160, 0.1) !important;
            border-color: var(--correct) !important;
            color: var(--correct) !important;
        }

        .option.correct .option-letter {
            color: var(--correct) !important;
        }

        .option.wrong {
            background: rgba(255, 92, 122, 0.1) !important;
            border-color: var(--wrong) !important;
            color: var(--wrong) !important;
        }

        .option.wrong .option-letter {
            color: var(--wrong) !important;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 13px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.88;
        }

        .btn-ghost {
            background: var(--card);
            border: 1.5px solid var(--border);
            color: var(--text);
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ===== RESULT SCREEN ===== */
        #result-screen {
            animation: fadeUp 0.4s ease;
        }

        .result-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .result-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .score-ring {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            background: rgba(108, 99, 255, 0.07);
            margin: 16px 0;
            box-shadow: 0 0 40px var(--glow);
        }

        .score-ring .num {
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
        }

        .score-ring .label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .wrong-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-top: 24px;
            margin-bottom: 20px;
        }

        .wrong-section h3 {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .wrong-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .wrong-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .wrong-item .q {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .ans-wrong {
            color: var(--wrong);
        }

        .ans-correct {
            color: var(--correct);
        }

        .result-btns {
            display: flex;
            gap: 10px;
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">☀️</button>

    <div class="wrap">

        <!-- SELECTION SCREEN -->
        <div id="select-screen">
            <div class="brand">
                <h1>Quiz Player</h1>
                <p>Choose a quiz to begin</p>
            </div>
            <div class="quiz-grid" id="quiz-grid"></div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <button class="back-btn" onclick="goHome()">← Quizzes</button>
                <div class="quiz-title-bar">
                    <h2 id="active-quiz-title"></h2>
                    <span id="q-count"></span>
                </div>
            </div>
            <div class="progress-wrap">
                <div id="progress-bar"></div>
            </div>
            <div class="q-meta" id="q-meta"></div>
            <div class="question" id="q-text"></div>
            <div class="options-grid" id="options-container"></div>
            <div class="btn-row">
                <button id="prev-btn" class="btn btn-ghost hidden" onclick="prevQuestion()">← Prev</button>
                <button id="next-btn" class="btn btn-primary hidden" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="hidden">
            <div class="result-header">
                <h2 id="result-quiz-title"></h2>
                <div class="score-ring">
                    <span class="num" id="final-score"></span>
                    <span class="label">correct</span>
                </div>
                <div id="result-msg" style="color:var(--muted);font-size:0.9rem;"></div>
            </div>
            <div class="wrong-section" id="wrong-section"></div>
            <div class="result-btns">
                <button class="btn btn-ghost" onclick="goHome()">← All Quizzes</button>
                <button class="btn btn-primary" onclick="restartQuiz()">🔄 Restart</button>
            </div>
        </div>

    </div>

                { question: "Which Zero Trust principle explicitly assumes compromise and designs systems to reduce impact?", options: ["Assume Breach", "Measured Service", "Resource Pooling", "Vendor Dependency"], answer: 0 },
    
                { question: "Which API role allows infrastructure-as-code tools such as Terraform and Ansible to provision and manage cloud resources programmatically?", options: ["User Experience Enhancement", "Automation and Orchestration", "Data Residency Disclosure", "Chain of Custody"], answer: 1 },
                { question: "Which vulnerability occurs when an API exposes more data than necessary, creating privacy and compliance risk?", options: ["Excessive Data Exposure", "SYN Flood", "VM Escape", "Resource Contention"], answer: 0 },
                { question: "Which vulnerability allows authenticated users to access resources they should not be able to access?", options: ["Broken Authentication", "Improper Authorization", "Synthetic Monitoring", "Storage Tiering"], answer: 1 },
                { question: "Which API vulnerability involves blindly accepting client-provided data that can modify unintended fields or escalate privileges?", options: ["Mass Assignment", "DNS Amplification", "Credential Stuffing", "Side-Channel Attack"], answer: 0 },
                { question: "Which authentication method provides mutual identity verification between client and server using digital certificates?", options: ["API Keys", "JSON Web Tokens (JWT)", "Mutual TLS (mTLS)", "Password Rotation only"], answer: 2 },
                { question: "Which secure API practice directly prevents SQL injection or command injection by accepting only known-good input and sanitizing data?", options: ["Input validation with whitelisting and parameterized queries", "Ignoring request logs", "Returning detailed stack traces to users", "Allowing unlimited requests per client"], answer: 0 },
    
                { question: "Which set contains only performance monitoring metrics from the material?", options: ["CPU utilization, memory usage, disk I/O, network latency, application response times", "GDPR rights, PHI, BAA, breach notification", "Spoofing, Tampering, Repudiation, Elevation of Privilege", "Subject attributes, resource attributes, action attributes, environmental attributes"], answer: 0 },
                { question: "Which monitoring technique simulates user interactions to assess availability?", options: ["Synthetic Monitoring", "Storage Tiering", "Federated Identity", "SMPC"], answer: 0 },
                { question: "Which cost optimization issue means paying for resources that are allocated but not meaningfully used?", options: ["Overprovisioning", "Cross-site request forgery", "Mass Assignment", "Data minimization"], answer: 0 },
                { question: "Which scaling mechanism adds or removes VMs or containers rather than changing CPU or RAM of existing instances?", options: ["Vertical Scaling", "Horizontal Scaling", "Scheduled Scaling", "Predictive Scaling"], answer: 1 },
                { question: "Which auto-scaling mechanism uses machine learning to anticipate load changes and adjust resources proactively?", options: ["Step Scaling", "Target Tracking Scaling", "Predictive Scaling", "Manual Scaling"], answer: 2 },
                { question: "Which benchmarking tool is matched correctly with its main use?", options: ["Apache JMeter: load testing web applications", "fio: identity federation", "Iperf: source-code vulnerability scanning", "YCSB: firewall rule generation"], answer: 0 },
    
                { question: "Why is cloud forensics more challenging than traditional device forensics?", options: ["Cloud evidence is always stored on a single physical disk under investigator control", "Cloud infrastructure is distributed, virtualized, multi-tenant, and often controlled by third-party providers", "Cloud systems never produce logs", "Cloud investigations do not involve legal restrictions"], answer: 1 },
                { question: "Which issue arises when cloud evidence resides in different countries with different laws and cross-border transfer restrictions?", options: ["Jurisdictional Challenge", "Resource Right-Sizing", "API Versioning", "Storage Tiering"], answer: 0 },
                { question: "Which multi-tenant forensic challenge is caused by logs and metadata being mixed with other tenants' data?", options: ["Need for careful filtering and analysis to isolate tenant-specific evidence", "Requirement to disable all audit trails", "Automatic proof of chain of custody", "Elimination of privacy law requirements"], answer: 0 },
                { question: "Which evidence preservation action verifies integrity by creating a digital fingerprint of evidence?", options: ["Cryptographic hashing such as SHA-256", "Blackhole routing", "Random URL targeting", "Horizontal scaling"], answer: 0 },
                { question: "Which AWS tools are identified as useful for forensic investigations by logging API activity and monitoring malicious behavior?", options: ["AWS CloudTrail and Amazon GuardDuty", "AWS Cost Explorer and AWS Lambda", "AWS Glacier and Route 53 only", "AWS S3 Transfer Acceleration and EC2 Spot Instances"], answer: 0 },
                { question: "In the ransomware case study, which tool and technique combination helped investigators analyze intrusion patterns and recover data?", options: ["Azure Security Center and backup snapshots", "Google Workspace and public-read buckets", "XACML and Data Portability", "KVM and rate limiting"], answer: 0 },
    
                { question: "Which GDPR implication requires cloud data breaches to be reported within a specific timeframe?", options: ["Breach reporting within 72 hours", "Quarterly breach reporting only", "Reporting only after criminal conviction", "No reporting when a processor is outside the EU"], answer: 0 },
                { question: "Under HIPAA, what must cloud providers sign with healthcare clients handling Protected Health Information (PHI)?", options: ["Business Associate Agreements (BAAs)", "Cloud Cost Reports", "Anycast Routing Statements", "SYN Handshake Waivers"], answer: 0 },
                { question: "Which standard is specifically developed to secure cardholder data and prevent credit card fraud?", options: ["PCI-DSS", "SOC 2", "FedRAMP", "CCPA"], answer: 0 },
                { question: "Which framework is mandatory for U.S. federal agencies using cloud services and focuses on standard security assessments and continuous monitoring?", options: ["FedRAMP", "GDPR", "YCSB", "OWASP Top 10"], answer: 0 },
                { question: "Which risk management step deploys encryption, access management, and monitoring systems after likelihood and impact are analyzed?", options: ["Asset Identification", "Threat Modeling", "Risk Analysis", "Control Implementation"], answer: 3 },
                { question: "Which documentation area records data types, processing purposes, and storage locations for compliance and audits?", options: ["Data Inventory", "Content Delivery Cache", "Source IP Spoofing Table", "Attack Simulation Diagram"], answer: 0 },
    
                { question: "Which three core principles define trustworthy computing in the cloud material?", options: ["Security, Privacy, Reliability", "Cost, Speed, Branding", "Elasticity, Metering, Brokerage", "Latency, Throughput, IOPS"], answer: 0 },
                { question: "Which privacy practice is specifically listed as part of trustworthy cloud services?", options: ["Data minimization and consent", "Unlimited data collection without disclosure", "Public error messages with personal data", "Shared admin accounts"], answer: 0 },
                { question: "Which reliability mechanism focuses on keeping service access consistent under stress or unexpected conditions?", options: ["Fault tolerance and redundancy", "Mass assignment", "Credential stuffing", "Open public-read access"], answer: 0 },
                { question: "Which trust-building mechanism uses external audits and certifications such as FedRAMP and CSA STAR?", options: ["Independent Certifications", "Synthetic Monitoring", "Vertical Scaling", "DAC Delegation"], answer: 0 },
                { question: "Which secure SDLC phase includes static and dynamic analysis, penetration testing, and code reviews?", options: ["Requirements Analysis", "Design", "Testing", "Deployment"], answer: 2 },
                { question: "Which transparency mechanism gives clear information about where data is stored and processed?", options: ["Data Residency Disclosure", "Blackhole Routing", "SYN Filtering", "Step Scaling"], answer: 0 },
    
                { question: "What gap does secure computation address in traditional cloud security models?", options: ["Data is often protected at rest and in transit but exposed during processing", "Cloud storage is never encrypted at rest", "All data must be processed only on physical paper", "APIs cannot communicate across services"], answer: 0 },
                { question: "Which homomorphic encryption type supports arbitrary computations on encrypted data?", options: ["Partially Homomorphic Encryption (PHE)", "Somewhat Homomorphic Encryption (SHE)", "Fully Homomorphic Encryption (FHE)", "Plaintext Homomorphic Encryption (PHE)"], answer: 2 },
                { question: "Why is Fully Homomorphic Encryption (FHE) not yet suitable for many real-time large-scale processing tasks?", options: ["It is computationally intensive", "It requires all data to be public", "It cannot support any operation", "It works only without encryption keys"], answer: 0 },
                { question: "How does Secure Multi-Party Computation (SMPC) preserve privacy during joint computation?", options: ["Each party splits data into shares, computation runs on shares, and the final result is reconstructed", "Each party uploads raw data to a public bucket", "One bank receives all customer records from all other banks", "The cloud provider decrypts all data before processing"], answer: 0 },
                { question: "What is the main tradeoff of Trusted Execution Environments (TEEs) compared with FHE or SMPC?", options: ["Better performance for many workloads, but requires trust in hardware vendors and may face side-channel attacks", "No isolation but perfect privacy", "Only works for credit-card compliance reports", "Cannot execute computations"], answer: 0 },
                { question: "Which future direction combines multiple secure computation techniques to balance performance and security?", options: ["Hybrid models combining HE, SMPC, and TEEs", "Disabling all cryptography during processing", "Replacing all cloud providers with local storage", "Using public-read buckets for analytics"], answer: 0 }
                    ]
                },
            ];
        // ============================================================

        let activeQuiz = null;
        let questions = [];
        let originalQuestions = [];
        let currentIdx = 0;
        let score = 0;
        let userAnswers = [];

        // ---- Theme ----
        function toggleTheme() {
            document.body.classList.toggle('light');
            document.querySelector('.theme-toggle').textContent =
                document.body.classList.contains('light') ? '🌙' : '☀️';
        }

        // ---- Build selection screen ----
        function buildSelectScreen() {
            const grid = document.getElementById('quiz-grid');
            grid.innerHTML = '';
            ALL_QUIZZES.forEach(quiz => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.innerHTML = `
                <span class="quiz-card-icon">${quiz.icon}</span>
                <h3>${quiz.title}</h3>
                <p>${quiz.description}</p>
                <div class="quiz-card-meta">
                    <span class="badge accent">${quiz.questions.length} questions</span>
                    ${quiz.shuffleQuestions ? '<span class="badge">Shuffled</span>' : ''}
                </div>
            `;
                card.onclick = () => startQuiz(quiz);
                grid.appendChild(card);
            });
        }

        // ---- Navigation ----
        function show(id) {
            ['select-screen', 'quiz-screen', 'result-screen'].forEach(s => {
                document.getElementById(s).classList.toggle('hidden', s !== id);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
            activeQuiz = null;
            show('select-screen');
        }

        // ---- Start quiz ----
        function startQuiz(quiz) {
            activeQuiz = quiz;
            currentIdx = 0;
            score = 0;
            userAnswers = [];

            originalQuestions = JSON.parse(JSON.stringify(quiz.questions));
            questions = prepare(JSON.parse(JSON.stringify(quiz.questions)), quiz);

            document.getElementById('active-quiz-title').textContent = quiz.title;
            show('quiz-screen');
            loadQuestion();
        }

        function prepare(qs, quiz) {
            if (quiz.shuffleQuestions) qs.sort(() => Math.random() - 0.5);
            if (quiz.shuffleAnswers) {
                qs.forEach(q => {
                    const correct = q.options[q.answer];
                    const idx = q.options.map((_, i) => i);
                    for (let i = idx.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [idx[i], idx[j]] = [idx[j], idx[i]];
                    }
                    q.options = idx.map(i => q.options[i]);
                    q.answer = q.options.indexOf(correct);
                });
            }
            return qs;
        }

        // ---- Load question ----
        function loadQuestion() {
            if (currentIdx >= questions.length) { showResult(); return; }

            const q = questions[currentIdx];
            const total = questions.length;
            const pct = (currentIdx / total) * 100;

            document.getElementById('q-meta').textContent = `Question ${currentIdx + 1} of ${total}`;
            document.getElementById('q-count').textContent = `${currentIdx + 1} / ${total}`;
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('q-text').textContent = q.question;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerHTML = `<span class="option-letter">${letters[i]}.</span><span>${opt}</span>`;
                btn.onclick = () => checkAnswer(i, btn);
                container.appendChild(btn);
            });

            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            prevBtn.classList.toggle('hidden', currentIdx === 0);
            nextBtn.classList.add('hidden');
            nextBtn.textContent = currentIdx === total - 1 ? 'Submit ✓' : 'Next →';

            // Restore answer if already answered
            const ua = userAnswers[currentIdx];
            if (ua) {
                const allBtns = container.querySelectorAll('.option');
                allBtns.forEach(b => b.disabled = true);
                const selIdx = questions[currentIdx].options.indexOf(ua.selected);
                allBtns[questions[currentIdx].answer].classList.add('correct');
                if (!ua.isCorrect && selIdx >= 0) allBtns[selIdx].classList.add('wrong');
                nextBtn.classList.remove('hidden');
            }
        }

        function checkAnswer(selected, btn) {
            const q = questions[currentIdx];
            const allBtns = document.querySelectorAll('.option');
            allBtns.forEach(b => b.disabled = true);

            const isCorrect = selected === q.answer;
            userAnswers[currentIdx] = {
                question: q.question,
                selected: q.options[selected],
                correct: q.options[q.answer],
                isCorrect
            };

            if (isCorrect) { btn.classList.add('correct'); score++; }
            else { btn.classList.add('wrong'); allBtns[q.answer].classList.add('correct'); }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() { currentIdx++; loadQuestion(); window.scrollTo(0, 0); }
        function prevQuestion() { if (currentIdx > 0) { currentIdx--; loadQuestion(); window.scrollTo(0, 0); } }

        // ---- Restart ----
        function restartQuiz() {
            currentIdx = 0; score = 0; userAnswers = [];
            questions = prepare(JSON.parse(JSON.stringify(originalQuestions)), activeQuiz);
            document.getElementById('progress-bar').style.width = '0%';
            show('quiz-screen');
            loadQuestion();
        }

        // ---- Results ----
        function showResult() {
            document.getElementById('result-quiz-title').textContent = activeQuiz.title + ' — Results';
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;
            const pct = Math.round((score / questions.length) * 100);
            document.getElementById('result-msg').textContent =
                pct === 100 ? '🎉 Perfect score!' :
                    pct >= 80 ? '🔥 Great job!' :
                        pct >= 60 ? '👍 Good effort!' :
                            '📖 Keep studying!';

            const ws = document.getElementById('wrong-section');
            const wrongs = userAnswers.filter(a => !a.isCorrect);
            if (wrongs.length === 0) {
                ws.innerHTML = '<h3>Review</h3><p style="color:var(--correct);margin-top:8px;">✓ All answers correct!</p>';
            } else {
                let html = '<h3>Review Wrong Answers</h3>';
                wrongs.forEach((wa, i) => {
                    html += `<div class="wrong-item">
                    <div class="q">${i + 1}. ${wa.question}</div>
                    <div class="ans-wrong">✗ Your answer: ${wa.selected}</div>
                    <div class="ans-correct">✓ Correct: ${wa.correct}</div>
                </div>`;
                });
                ws.innerHTML = html;
            }

            document.getElementById('progress-bar').style.width = '100%';
            show('result-screen');
        }

        // ---- Init ----
        window.addEventListener('load', buildSelectScreen);
        window.onbeforeunload = () => activeQuiz ? "Reloading will reset your quiz progress." : undefined;
    </script>
</body>
